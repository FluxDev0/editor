<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Multi-Track Sequencer</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="app-layout">
    
        <!-- LINKES PANEL: Sidebar / Controls -->
        <aside id="sidebarPane" class="pane sidebar-pane">
            <h2>Track Control</h2>
            <div class="sidebar-section">
                <label>Aktive Spur:
                    <select id="trackSelect"></select>
                </label>
                <button id="addTrackBtn">+ Neue Spur</button>
            </div>
    
            <div class="sidebar-section" id="sequencer-inputs">
                <h3>Song-Einstellungen</h3>
                <label>Steps:
                    <input type="number" id="totalSteps" min="16" max="256" step="16">
                </label>
                <label>Reihen:
                    <input type="number" id="numRows" min="0" max="512">
                </label>
                <label>BPM:
                    <input type="number" id="bpm" min="1" max="400" step="10">
                </label>
                <label>Zellenbreite:
                    <input type="number" id="cellWidth" min="1" max="50">
                </label>
                <label>Zellenhöhe:
                    <input type="number" id="cellHeight" min="1" max="50">
                </label>
            </div>
        </aside>
    
        <!-- VERTIKALER SPLITTER (Links <-> Rechts) -->
        <div id="gutterSidebar" class="gutter gutter-col"></div>
    
        <!-- RECHTER HAUPTBEREICH (Sequencer oben + FX/Synth unten) -->
        <main id="mainPane" class="pane main-pane">
    
            <!-- OBERES PANEL: Sequencer & Toolbar -->
            <section id="sequencerPane" class="pane sequencer-pane">
                <div class="toolbar">
                    <button id="playBtn">▶ Play Sequence</button>
                    <button id="stopBtn">⏹ Stop</button>
                </div>
    
                <div class="canvas-container">
                    <canvas id="gridCanvas"></canvas>
                </div>
            </section>
    
            <!-- HORIZONTALER SPLITTER (Oben <-> Unten) -->
            <div id="gutterMain" class="gutter gutter-row"></div>
    
            <!-- UNTERES PANEL: Synth & FX Parameter -->
            <section id="bottomPane" class="pane bottom-pane">
                <div class="inputs" id="synth-inputs">
                    <label>
                        <select id="type">
                            <option value="custom">Custom (nicht unterstützt)</option>
                            <option value="sawtooth">Sägezahn</option>
                            <option value="sine">Sinus Welle</option>
                            <option value="square">Rechteck</option>
                            <option value="triangle">Dreieck</option>
                        </select>
                    </label>

                    <label>Octave-Shift:
                        <input type="number" id="octaveShift" min="-10" max="10" step="1">
                        <br>
                        <input type="range"  id="octaveShift" min="-10" max="10" step="1">
                    </label>

                    <label>Detune:
                        <input type="number" id="detune" min="0" max="2" step="0.1">
                        <br>
                        <input type="range"  id="detune" min="0" max="2" step="0.1">
                    </label>

                    <label>Attack:
                        <input type="number" id="attack" min="0" max="2" step="0.1">
                        <br>
                        <input type="range" id="attack" min="0" max="2" step="0.1">
                    </label>

                    <label>Decay:
                        <input type="number" id="decay" min="0" max="2" step="0.1">
                        <br>
                        <input type="range" id="decay" min="0" max="2" step="0.1">
                    </label>

                    <label>Sustain:
                        <input type="number" id="sustain" min="0" max="1" step="0.1">
                        <br>
                        <input type="range" id="sustain" min="0" max="1" step="0.1">
                    </label>

                    <label>Release:
                        <input type="number" id="release" min="0" max="3" step="0.1">
                        <br>
                        <input type="range" id="release" min="0" max="3" step="0.1">
                    </label>

                    <label>Filter-Resonance:
                        <input type="number" id="filterResonance" min="0" max="3" step="0.1">
                        <br>
                        <input type="range" id="filterResonance" min="0" max="3" step="0.1">
                    </label>

                    <label>Filter-Cutoff:
                        <input type="number" id="filterCutoff" min="0" max="30000" step="10">
                        <br>
                        <input type="range" id="filterCutoff" min="0" max="30000" step="10">
                    </label>
                </div>
            </section>
    
        </main>
    </div>
    
    <script src="main.js" type="module"></script>
</body>
</html>
