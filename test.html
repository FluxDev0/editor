<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profi Code-Editor</title>
    
    <!-- CodeMirror CSS Basis & Theme (Dunkel) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">

    <style>
        body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: sans-serif; background: #1e1e1e; }
        
        /* Toolbar für Buttons */
        .toolbar { padding: 10px; background: #2d2d2d; border-bottom: 2px solid #000; display: flex; gap: 10px; }
        .toolbar button { background: #4CAF50; color: white; border: none; padding: 8px 15px; cursor: pointer; font-size: 14px; border-radius: 4px; }
        .toolbar button:hover { background: #45a049; }
        
        /* Editor Bereich */
        .editors { display: flex; height: 50%; width: 100%; }
        .editor-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #000; overflow: hidden; }
        .editor-container label { background: #111; color: #aaa; padding: 5px 10px; font-size: 12px; font-family: monospace; text-transform: uppercase; }
        
        /* Wichtig: CodeMirror auf 100% Höhe zwingen */
        .CodeMirror { height: 100% !important; font-size: 15px; font-family: 'Courier New', Courier, monospace; }
        
        /* Vorschaufenster */
        iframe { width: 100%; height: 50%; border: none; background: white; border-top: 2px solid #000; }
    </style>
</head>
<body>

    <!-- Verstecktes Feld für den Datei-Upload -->
    <input type="file" id="file-upload" accept=".html" style="display: none;">

    <div class="toolbar">
        <button onclick="downloadCode()">💾 Code herunterladen (.html)</button>
        <button onclick="document.getElementById('file-upload').click()">📂 Code hochladen (.html)</button>
    </div>

    <!-- Die Eingabefelder -->
    <div class="editors">
        <div class="editor-container">
            <label>HTML</label>
            <textarea id="html-code"></textarea>
        </div>
        <div class="editor-container">
            <label>CSS</label>
            <textarea id="css-code"></textarea>
        </div>
        <div class="editor-container">
            <label>JavaScript</label>
            <textarea id="js-code"></textarea>
        </div>
    </div>

    <!-- Das Vorschaufenster -->
    <iframe id="preview"></iframe>

    <!-- CodeMirror JS Basis & Programmiersprachen-Regeln (Modes) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>

    <!-- Deine App-Logik -->
    <script>
        // 1. CODEMIRROR INITIALISIEREN
        const editorConfig = {
            theme: "monokai",
            lineNumbers: true,
            lineWrapping: true
        };

        const htmlEditor = CodeMirror.fromTextArea(document.getElementById('html-code'), { ...editorConfig, mode: "xml" });
        const cssEditor = CodeMirror.fromTextArea(document.getElementById('css-code'), { ...editorConfig, mode: "css" });
        const jsEditor = CodeMirror.fromTextArea(document.getElementById('js-code'), { ...editorConfig, mode: "javascript" });

        // Startwerte setzen
        htmlEditor.setValue("<h1>Hallo Programmierer!</h1>\n<p>Dieser Editor nutzt jetzt CodeMirror.</p>");
        cssEditor.setValue("h1 {\n  color: #4CAF50;\n}");
        jsEditor.setValue("console.log('Editor geladen!');");

        // 2. VORSCHAU AKTUALISIEREN
        const preview = document.getElementById('preview');

        function updatePreview() {
            const html = htmlEditor.getValue();
            const css = `<style>${cssEditor.getValue()}<\/style>`;
            const js = `<script>${jsEditor.getValue()}<\/script>`;
            
            preview.srcdoc = html + css + js;
        }

        // Sobald in einem Editor getippt wird -> Vorschau updaten
        htmlEditor.on("change", updatePreview);
        cssEditor.on("change", updatePreview);
        jsEditor.on("change", updatePreview);

        // Einmal am Anfang ausführen
        updatePreview();

        // 3. HERUNTERLADEN-FUNKTION
        function downloadCode() {
            // Wir bauen eine saubere HTML-Struktur auf
            const fullCode = `<!DOCTYPE html>
            <html lang="de">
            <head>
                <meta charset="UTF-8">
                <title>Mein Exportiertes Projekt</title>
                <style>
            ${cssEditor.getValue()}
                </style>
            </head>
            <body>
            ${htmlEditor.getValue()}
                
                <script>
            ${jsEditor.getValue()}
                <\/script>
            </body>
            </html>`;

            // Verwandle den Text in eine Datei ("Blob")
            const blob = new Blob([fullCode], { type: "text/html" });
            const url = URL.createObjectURL(blob);
            
            // Erstelle einen unsichtbaren Link und klicke ihn an
            const a = document.createElement('a');
            a.href = url;
            a.download = "mein_projekt.html";
            a.click();
            
            // Aufräumen
            URL.revokeObjectURL(url);
        }

        // 4. HOCHLADEN-FUNKTION
        document.getElementById('file-upload').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                
                // Wir tun so, als wäre der geladene Text eine unsichtbare Website im Browser
                const parser = new DOMParser();
                const doc = parser.parseFromString(content, 'text/html');

                // 1. CSS herausfiltern
                let cssText = "";
                doc.querySelectorAll("style").forEach(styleTag => {
                    cssText += styleTag.innerHTML + "\n";
                    styleTag.remove(); // Danach aus dem Dokument löschen
                });

                // 2. JavaScript herausfiltern
                let jsText = "";
                doc.querySelectorAll("script").forEach(scriptTag => {
                    jsText += scriptTag.innerHTML + "\n";
                    scriptTag.remove(); // Danach aus dem Dokument löschen
                });

                // 3. HTML ist das, was im <body> übrig bleibt
                let htmlText = doc.body.innerHTML.trim();

                // 4. Den Code in die Editoren einfügen
                htmlEditor.setValue(htmlText);
                cssEditor.setValue(cssText.trim());
                jsEditor.setValue(jsText.trim());
            };
            
            // Datei als Text lesen
            reader.readAsText(file);
            
            // Input zurücksetzen (damit man die gleiche Datei nochmal laden kann)
            event.target.value = "";
        });
    </script>
</body>
</html>
