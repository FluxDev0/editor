<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Code-Editor</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="overlay">
        <input type="text" id="room-name">
        <input type="text" id="room-password">
        <button onclick="connectEverything()">
    </div>

    <div class="info-bar">
        <span>Online HTML Editor</span>
        <span class="status" id="status-text">Verbinde...</span>
    </div>

    <div class="editors">
        <div class="editor-container">
            <label>HTML (Live mit anderen)</label>
            <textarea id="html-code"></textarea>
        </div>
    </div>

    <iframe id="preview"></iframe>

    <!-- CodeMirror Basis laden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>

    <!-- HIER KOMMT DIE MULTIPLAYER MAGIE (Als Modul) -->
    <script src="script.js" type="module"></script>
</body>
</html>
