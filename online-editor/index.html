<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Code-Editor</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">

    <style>
        body { 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            font-family: sans-serif; 
            background: #1e1e1e; 
            color: white;}
        .info-bar { padding: 10px; background: #2d2d2d; border-bottom: 2px solid #000; display: flex; justify-content: space-between; }
        .editors { display: flex; height: 50%; }
        .editor-container { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #000; }
        .editor-container label { background: #111; color: #aaa; padding: 5px 10px; font-size: 12px; font-family: monospace; }
        .CodeMirror { height: 100% !important; font-size: 15px; }
        iframe { width: 100%; height: 50%; border: none; background: white; border-top: 2px solid #000; }
        .status { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>

    <div class="info-bar">
        <span>Online HTML Editor</span>
        <span class="status" id="status-text">Verbinde...</span>
    </div>

    <div class="editors">
        <div class="editor-container">
            <label>HTML (Live mit anderen)</label>
            <textarea id="html-code"></textarea>
        </div>
    </div>

    <iframe id="preview"></iframe>

    <!-- CodeMirror Basis laden -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>

    <!-- HIER KOMMT DIE MULTIPLAYER MAGIE (Als Modul) -->
    <script type="module">
        // Wir importieren Yjs und die WebRTC-Verbindung von einem CDN (esm.sh)
        import * as Y from 'https://esm.sh/yjs';
        import { WebrtcProvider } from 'https://esm.sh/y-webrtc';
        import { CodeMirrorBinding } from 'https://esm.sh/y-codemirror';

        // 1. Erstelle ein Yjs Dokument (Das ist das "Gehirn", das den Text synchronisiert)
        const ydoc = new Y.Doc();

        function connectEverything() {
            const provider = new WebrtcProvider('mein-geheimer-raum-123', ydoc, {
                password: 'passwort'
            });

            // 3. Zeige den Verbindungsstatus an
            provider.on('synced', (state) => {
                document.getElementById('status-text').innerText = "Verbunden mit anderen!";
            });

            // 4. Erstelle ein synchronisiertes Text-Feld im Yjs Dokument
            const yText = ydoc.getText('codemirror');

            // 5. CodeMirror Editor ganz normal starten
            const htmlEditor = CodeMirror.fromTextArea(document.getElementById('html-code'), {
                theme: "monokai",
                mode: "xml",
                lineNumbers: true
            });

            // 6. Die Brücke schlagen: Verbinde CodeMirror mit dem synchronisierten yText
            const binding = new CodeMirrorBinding(yText, htmlEditor, provider.awareness);

            // --- Vorschau Update Logik ---
            const preview = document.getElementById('preview');

            function updatePreview() {
                preview.srcdoc = htmlEditor.getValue();
            }

            // Immer wenn sich das synchronisierte Dokument ändert, Vorschau updaten
            yText.observe(() => {
                updatePreview();
            });
        }
    </script>
</body>
</html>
